# Perfil "local": SOLO para la PC de desarrollo. Lo activa local/start-all.ps1
# (SPRING_PROFILES_ACTIVE=local). Sin secretos: solo localhost, postgres/password, puertos, pool y seeds.
server.port=${PORT:8084}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/edifika_payment}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
# pocas conexiones por servicio: 10 servicios contra un solo PostgreSQL local
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:4}
# datos de prueba (data.sql, idempotente) en cada arranque
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true
