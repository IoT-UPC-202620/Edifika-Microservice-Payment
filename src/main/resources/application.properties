# Configuración del microservicio Payment de Edifika.
# Todos los valores sensibles o dependientes del entorno se pueden sobrescribir con variables de entorno.
spring.application.name=Edifika-Microservice-Payment

# Variables locales (.env en la raiz del proyecto, ignorado por git)
spring.config.import=optional:file:.env[.properties]

# Servidor
server.port=${PORT:8084}

# Base de datos: solo por variables de entorno (sin credenciales en el repo)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=com.edifika.payment.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# JWT mismo secret que IAM
jwt.secret=${JWT_SECRET}
jwt.expiration.days=${JWT_EXPIRATION_DAYS:365}

# Documentacion
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# Pasarela de pagos: culqi (real) | simulated (solo desarrollo, no cobra)
payment.gateway.provider=${PAYMENT_GATEWAY_PROVIDER:culqi}
culqi.api-url=${CULQI_API_URL:https://api.culqi.com/v2}
culqi.secret-key=${CULQI_SECRET_KEY}
culqi.connect-timeout=5s
culqi.read-timeout=15s

# Vencimiento de deudas: todos los dias a la 01:00 (hora de Lima)
payment.time-zone=America/Lima
payment.debts.overdue-check-cron=${DEBT_OVERDUE_CRON:0 0 1 * * *}

# Validacion de unidades contra su microservicio (desactivada hasta confirmar el endpoint)
integration.units.validation-enabled=${UNITS_VALIDATION_ENABLED:false}
integration.units.base-url=${UNITS_SERVICE_URL:http://localhost:8082}
integration.units.unit-path=${UNITS_SERVICE_UNIT_PATH:/api/v1/units/{unitId}}
integration.units.timeout=5s

# CORS: origenes del frontend separados por coma
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000}

# data.sql (datos de prueba) solo se ejecuta con el perfil "local"
spring.sql.init.mode=never
